<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Space Wave</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .space {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    ellipse at center,
                    #03150b 0%,
                    #010804 35%,
                    #000000 75%
                );
        }

        /* =========================
           STARS
        ========================= */

        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, white 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1px);

            background-size:
                120px 120px,
                190px 190px,
                260px 260px;

            background-position:
                20px 30px,
                80px 100px,
                150px 50px;

            opacity: .55;

            animation: starsMove 30s linear infinite;
        }

        @keyframes starsMove {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(120px);
            }
        }

        /* =========================
           DISTANT GREEN SPACE GLOW
        ========================= */

        .space-glow {
            position: absolute;

            width: 700px;
            height: 700px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(0, 255, 100, .18),
                    rgba(0, 255, 100, .07) 30%,
                    transparent 70%
                );

            filter: blur(35px);

            animation: spaceGlow 4s ease-in-out infinite;
        }

        @keyframes spaceGlow {

            0%,
            100% {
                opacity: .45;
                transform: translate(-50%, -50%) scale(.8);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        /* =========================
           MAIN GREEN WAVE
        ========================= */

        .wave {
            position: absolute;

            width: 130%;
            height: 42%;

            left: -120%;
            top: 30%;

            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(0,255,100,.03) 15%,
                    rgba(0,255,100,.25) 35%,
                    rgba(0,255,100,.8) 48%,
                    #00ff66 50%,
                    rgba(0,255,100,.55) 58%,
                    rgba(0,255,100,.08) 80%,
                    transparent 100%
                );

            border-radius: 50%;

            filter:
                blur(12px)
                drop-shadow(0 0 25px #00ff66)
                drop-shadow(0 0 70px rgba(0,255,100,.8));

            transform:
                rotate(-7deg)
                skewX(-12deg);

            animation: waveMove 5s ease-in-out infinite;
        }

        @keyframes waveMove {

            0% {
                left: -120%;
                transform:
                    rotate(-7deg)
                    skewX(-12deg)
                    scale(.85);
            }

            50% {
                left: -5%;
                transform:
                    rotate(-7deg)
                    skewX(-12deg)
                    scale(1.1);
            }

            100% {
                left: 120%;
                transform:
                    rotate(-7deg)
                    skewX(-12deg)
                    scale(.85);
            }
        }

        /* =========================
           WAVE RIPPLE
        ========================= */

        .ripple {
            position: absolute;

            width: 75vw;
            height: 180px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border: 3px solid rgba(0,255,100,.5);

            box-shadow:
                0 0 20px #00ff66,
                0 0 50px rgba(0,255,100,.6),
                inset 0 0 30px rgba(0,255,100,.3);

            filter: blur(2px);

            animation: ripple 3s ease-out infinite;
        }

        .ripple:nth-child(2) {
            animation-delay: 1s;
        }

        .ripple:nth-child(3) {
            animation-delay: 2s;
        }

        @keyframes ripple {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(.3);
            }

            30% {
                opacity: .9;
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(1.8);
            }
        }

        /* =========================
           SPLASH PARTICLES
        ========================= */

        .particle {
            position: absolute;

            width: 4px;
            height: 4px;

            background: #00ff66;

            border-radius: 50%;

            box-shadow:
                0 0 8px #00ff66,
                0 0 20px #00ff66;

            animation: particleMove 3s ease-out infinite;
        }

        .p1 {
            left: 42%;
            top: 51%;
            animation-delay: .1s;
        }

        .p2 {
            left: 48%;
            top: 48%;
            animation-delay: .5s;
        }

        .p3 {
            left: 54%;
            top: 52%;
            animation-delay: .9s;
        }

        .p4 {
            left: 60%;
            top: 47%;
            animation-delay: 1.3s;
        }

        .p5 {
            left: 38%;
            top: 55%;
            animation-delay: 1.7s;
        }

        .p6 {
            left: 57%;
            top: 58%;
            animation-delay: 2.1s;
        }

        .p7 {
            left: 45%;
            top: 60%;
            animation-delay: 2.4s;
        }

        @keyframes particleMove {

            0% {
                opacity: 0;
                transform: scale(0);
            }

            20% {
                opacity: 1;
                transform: scale(1.5);
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc(-150px + 300px * var(--x, .5)),
                        -180px
                    )
                    scale(0);
            }
        }

        /* =========================
           CENTER ENERGY
        ========================= */

        .energy {
            position: absolute;

            width: 300px;
            height: 40px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: #00ff66;

            border-radius: 50%;

            filter:
                blur(10px)
                drop-shadow(0 0 20px #00ff66)
                drop-shadow(0 0 60px #00ff66);

            animation: energyPulse 1.4s ease-in-out infinite;
        }

        @keyframes energyPulse {

            0%,
            100% {
                opacity: .35;
                transform:
                    translate(-50%, -50%)
                    scaleX(.65);
            }

            50% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scaleX(1.3);
            }
        }

    </style>
</head>

<body>

    <main class="space">

        <!-- Black space + stars -->
        <div class="stars"></div>

        <!-- Large atmospheric green glow -->
        <div class="space-glow"></div>

        <!-- Moving green wave -->
        <div class="wave"></div>

        <!-- Expanding energy ripples -->
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>

        <!-- Center energy -->
        <div class="energy"></div>

        <!-- Splash particles -->
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>
        <div class="particle p7"></div>

    </main>

</body>
</html>
